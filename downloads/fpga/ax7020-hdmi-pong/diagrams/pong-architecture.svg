<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 690" role="img" aria-labelledby="title desc"><title id="title">Pong 模块与信号流</title><desc id="desc">时钟模块驱动扫描、游戏和视频输出。按键经消抖送入游戏，扫描坐标和游戏状态共同生成颜色，再编码并串行输出到显示屏。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#52677e"/></marker></defs><rect width="860" height="690" rx="10" fill="#ffffff"/><g fill="#203247" font-family="Microsoft YaHei, Noto Sans SC, sans-serif"><g><rect x="240" y="20" width="380" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="430" y="47" text-anchor="middle" font-size="17" font-weight="600">50 MHz → clock_gen</text><text x="430" y="70" text-anchor="middle" font-size="14">25.2 MHz 像素时钟 / 126 MHz 串行时钟</text></g><g><rect x="35" y="145" width="300" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="185" y="172" text-anchor="middle" font-size="17" font-weight="600">key_filter ×3</text><text x="185" y="195" text-anchor="middle" font-size="14">KEY2 / KEY3 / KEY4 → 消抖与事件</text></g><g><rect x="525" y="145" width="300" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="675" y="172" text-anchor="middle" font-size="17" font-weight="600">video_timing</text><text x="675" y="195" text-anchor="middle" font-size="14">扫描 x/y、有效区与行场同步</text></g><g><rect x="35" y="280" width="300" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="185" y="307" text-anchor="middle" font-size="17" font-weight="600">pong_game</text><text x="185" y="330" text-anchor="middle" font-size="14">游戏状态、球和挡板坐标、分数、生命</text></g><g><rect x="295" y="395" width="270" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="430" y="422" text-anchor="middle" font-size="17" font-weight="600">video_render</text><text x="430" y="445" text-anchor="middle" font-size="14">扫描坐标 + 游戏状态 → RGB</text></g><g><rect x="295" y="500" width="270" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="430" y="527" text-anchor="middle" font-size="17" font-weight="600">tmds_encoder ×3</text><text x="430" y="550" text-anchor="middle" font-size="14">每路 8 位颜色 → 10 位符号</text></g><g><rect x="295" y="605" width="270" height="68" rx="8" fill="#eef5ff" stroke="#3b5c83"/><text x="430" y="632" text-anchor="middle" font-size="17" font-weight="600">tmds_serial / OBUFDS</text><text x="430" y="655" text-anchor="middle" font-size="14">串行发送与差分输出 → HDMI 显示屏</text></g><path d="M430 88 V118 H675 V145" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 213 V280" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 213 V247 H185 V280" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 348 V370 H370 V395" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M675 213 V370 H490 V395" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 463 V500" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M430 568 V605" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 54 H845 V639 H565" fill="none" stroke="#52677e" stroke-width="2" marker-end="url(#arrow)"/><text x="355" y="238" font-size="14">frame_tick：每帧一次</text><text x="650" y="350" font-size="14">x / y / de</text><text x="662" y="570" font-size="14">同源时钟</text></g></svg>